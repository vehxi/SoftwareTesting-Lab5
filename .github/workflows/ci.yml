name: CI - Generate & Run NUnit Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

jobs:
  test-generation-and-execution:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    steps:
      # 1. Получение кода
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Настройка среды Python для генератора
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      # 3. Генерация тестов из спецификации
      - name: Generate NUnit tests
        run: python generator/gen_tests.py --config config.yaml

      # 4. Настройка .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Используем 10.0 так как проект был инициализирован с ним

      # 5. Восстановление пакетов и сборка
      - name: Restore & Build
        run: dotnet build MyProject.slnx --configuration Release

      # 6. Запуск тестов (включая сгенерированные)
      - name: Run Tests
        run: dotnet test tests/Module.Tests/Module.Tests.csproj --logger "trx;LogFileName=test-results.trx" --verbosity normal

      # 7. Красивый отчет по тестам прямо в UI GitHub
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          trx_files: "tests/**/TestResults/*.trx"

      # 8. Сохранение результатов в артефакты
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nunit-test-results
          path: |
            tests/**/TestResults/
            tests/**/test-results.trx
